<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Preview</title>
<style>
  :root{--bg:#0b0f10;--ink:#e8eeee;--muted:#8a9a9c;--chip:#1a2224;--chip-on:#5EFF88}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(1200px 700px at 50% 20%,#17201f,var(--bg));color:var(--ink);font:500 13px/1.3 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;min-height:100vh}
  .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .bar button{border:0;border-radius:99px;padding:8px 14px;background:var(--chip);color:var(--ink);font:inherit;cursor:pointer}
  .bar button[aria-pressed="true"]{background:var(--chip-on);color:#06140b}
  .note{color:var(--muted);font-size:12px;text-align:center;max-width:46ch}

  /* the phone: outer titanium band, black bezel, rounded screen */
  .phone{--w:402px;--h:874px;--r:62px;position:relative;width:calc(var(--w) + 28px);height:calc(var(--h) + 28px);border-radius:calc(var(--r) + 14px);
    padding:14px;background:linear-gradient(145deg,#4a4f52,#1c1f21 40%,#2d3133 60%,#5a5f62);
    box-shadow:0 0 0 1px #0007,inset 0 0 0 1.5px #ffffff22,0 50px 90px -30px #000c,0 20px 40px -20px #000a;transform-origin:50% 0}
  .phone::before{content:"";position:absolute;inset:4px;border-radius:calc(var(--r) + 10px);background:#000}
  .btn{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#2a2e30,#5b6063)}
  .btn.l1{left:-3px;top:150px;height:30px}.btn.l2{left:-3px;top:210px;height:60px}.btn.l3{left:-3px;top:285px;height:60px}
  .btn.r1{right:-3px;top:240px;height:96px}.btn.r2{right:-3px;top:520px;height:56px;opacity:.7}
  .screen{position:relative;width:var(--w);height:var(--h);border-radius:var(--r);overflow:hidden;background:#061217;isolation:isolate}
  .status{position:absolute;inset:0 0 auto;height:54px;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0 44px;color:#fff;font:600 16px/1 -apple-system,BlinkMacSystemFont,sans-serif;background:#061217;pointer-events:none;transition:background .3s,color .3s}
  .status.light{background:#DCFFE5;color:#111}
  .island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:4}
  .icons{display:flex;gap:6px;align-items:center}
  .icons svg{display:block}
  iframe{position:absolute;left:0;top:54px;width:100%;height:calc(100% - 54px);border:0;background:#061217}
  .home{position:absolute;left:50%;bottom:8px;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:#8f9c9e;opacity:.9;z-index:3;pointer-events:none}
</style>
</head>
<body>
  <div class="bar" role="group" aria-label="Device">
    <button type="button" data-w="402" data-h="874" aria-pressed="true">iPhone 17 · 402×874</button>
    <button type="button" data-w="393" data-h="852" aria-pressed="false">iPhone 16 · 393×852</button>
    <button type="button" data-w="440" data-h="956" aria-pressed="false">17 Pro Max · 440×956</button>
    <button type="button" id="reload">Reload</button>
  </div>
  <div class="phone" id="phone">
    <span class="btn l1"></span><span class="btn l2"></span><span class="btn l3"></span><span class="btn r1"></span><span class="btn r2"></span>
    <div class="screen">
      <div class="status" id="status">
        <span id="clock">9:41</span>
        <span class="icons" aria-hidden="true">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.3 10.3 0 0 0 8 .4 10.3 10.3 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.3A7 7 0 0 0 8 3.8a7 7 0 0 0-4.8 1.9L4.4 7A5.2 5.2 0 0 1 8 5.6Zm0 3.4c.6 0 1.1.2 1.5.6L8 11.2 6.5 9.6c.4-.4.9-.6 1.5-.6Z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="currentColor" opacity=".45"/></svg>
        </span>
      </div>
      <span class="island" aria-hidden="true"></span>
      <iframe id="site" title="Portfolio on a phone" src="index.html"></iframe>
      <span class="home" aria-hidden="true"></span>
    </div>
  </div>
  <p class="note">Scroll inside the phone with your trackpad or mouse wheel. The site is shown at the real screen width, so its phone layout is what you see.</p>
<script>
  const phone = document.getElementById('phone'), site = document.getElementById('site'), status = document.getElementById('status');
  const btns = [...document.querySelectorAll('.bar button[data-w]')];
  // keep the whole phone on screen however tall the window is
  const fit = () => { const h = phone.offsetHeight, room = innerHeight - 140; const k = Math.min(1, room / h); phone.style.transform = `scale(${k})`; phone.style.marginBottom = `${(k - 1) * h}px`; };
  btns.forEach(b => b.addEventListener('click', () => {
    btns.forEach(x => x.setAttribute('aria-pressed', x === b)); phone.style.setProperty('--w', b.dataset.w + 'px'); phone.style.setProperty('--h', b.dataset.h + 'px');
    phone.style.setProperty('--r', (b.dataset.w > 420 ? 66 : 62) + 'px'); fit();
  }));
  document.getElementById('reload').addEventListener('click', () => { site.src = 'index.html?r=' + Date.now(); });
  addEventListener('resize', fit); fit();
  const tick = () => { const d = new Date(); document.getElementById('clock').textContent = d.getHours() % 12 || 12 + '' ; document.getElementById('clock').textContent = (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0'); };
  tick(); setInterval(tick, 15000);
  // status bar follows the band under it, like Safari's top bar does
  setInterval(() => {
    try {
      const D = site.contentDocument; if (!D) return;
      const el = D.elementFromPoint(20, 2); const band = el && el.closest('[data-tone]');
      status.classList.toggle('light', !!band && band.dataset.tone === 'mint');
    } catch (e) {}
  }, 250);
</script>
</body>
</html>
